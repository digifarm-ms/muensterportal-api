name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd muensterportal-api

            # Fetch + hard reset rather than pull. A `git pull` merges, so it
            # fails outright ("refusing to merge unrelated histories") whenever
            # main has been rewritten -- as it was by the wiki.sqlite history
            # purge. Resetting to the fetched tip tracks main unconditionally.
            git fetch origin main
            git reset --hard FETCH_HEAD
            git clean -fd

            docker compose pull
            docker compose build
            docker compose up -d