version: 2

# One full update sweep per ecosystem every Sunday: a single PR each.
# Merging into main deploys straight to the server.
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment;
  # Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Europe/Berlin
    versioning-strategy: lockfile-only
    # Let fresh releases age a few days; broken ones are usually yanked by then.
    cooldown:
      default-days: 5
    commit-message:
      prefix: deps
    groups:
      python:
        patterns: ["*"]
