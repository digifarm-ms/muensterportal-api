[project]
name = "muenster4you"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Alexander Milden", email = "Alexander@Milden.net" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "sentence-transformers>=6.0.1",
    # jina-embeddings-v5 requires transformers>=5.1; the old <5 pin existed
    # only for the gte cross-encoder reranker, which is no longer used.
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.52.4",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "streamlit>=1.63.0",
    "openai>=3.13.0",
    "mwparserfromhell>=0.6.6",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "rich>=13.7.0",
    "lancedb>=0.38.0",
    "peft>=0.20.0",
    "accelerate>=1.15.0",
    "mistralai>=2.10.0",
    "tavily>=1.1.0",
    "pydantic-ai-slim>=2.43,<3",
    "fast-langdetect>=1.0.1",
    "torch>=2.14.0",
]

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]
dev = ["ipykernel>=7.3.0", "ruff>=0.16.7"]

[project.scripts]
muenster4you = "muenster4you.api:main"
muenster4you-app = "muenster4you.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.9.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "W191", # indentation contains tabs
]

[tool.ruff.lint.isort]
known-first-party = ["muenster4you"]
